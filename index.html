<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>我的專屬電子寵物</title>
    <style>
        body { text-align: center; font-family: sans-serif; background-color: #f0f8ff; padding-top: 50px; }
        .pet { font-size: 100px; margin: 20px; transition: transform 0.2s; user-select: none; cursor: pointer; }
        .pet:active { transform: scale(1.2); }
        .stats { font-size: 24px; font-weight: bold; margin-bottom: 20px; color: #333; }
        button { font-size: 20px; padding: 10px 20px; margin: 10px; cursor: pointer; border-radius: 10px; background-color: #ffb6c1; border: none; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); }
        button:hover { background-color: #ff69b4; color: white; }
    </style>
</head>
<body>

    <h1>👾 實驗室小怪獸養成計畫 👾</h1>
    
    <div class="stats">
        🍖 飽食度: <span id="food">50</span> / 100 <br><br>
        🎾 開心度: <span id="happy">50</span> / 100
    </div>

    <div class="pet" id="petEmoji">👽</div>

    <div>
        <button onclick="feed()">🍖 餵食</button>
        <button onclick="play()">🎾 玩耍</button>
    </div>

    <script>
        let food = 50;
        let happy = 50;

        function updateUI() {
            // 更新數字顯示
            document.getElementById('food').innerText = food;
            document.getElementById('happy').innerText = happy;
            
            // 根據數值改變寵物表情
            let pet = document.getElementById('petEmoji');
            if (food <= 0 || happy <= 0) {
                pet.innerText = "👻";
                document.querySelector('h1').innerText = "小怪獸離開了...";
            } else if (food < 30 || happy < 30) {
                pet.innerText = "😭";
            } else if (food > 80 && happy > 80) {
                pet.innerText = "🥰";
            } else {
                pet.innerText = "👽";
            }
        }

        function feed() {
            if (food > 0 && happy > 0 && food < 100) food += 10;
            updateUI();
        }

        function play() {
            if (food > 0 && happy > 0 && happy < 100) happy += 10;
            updateUI();
        }

        // 每 3 秒自動扣數值，模擬時間流逝
        setInterval(() => {
            if (food > 0) food -= 5;
            if (happy > 0) happy -= 5;
            updateUI();
        }, 3000);
    </script>

</body>
</html>
